body { margin:0; background:var(--bg); padding:16px; }
svg { display:block; width:100%; max-width:760px; height:auto; margin:0 auto; }
svg text { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
.t { font-size:14px; fill:var(--p); } .ts { font-size:12px; fill:var(--s); } .th { font-size:14px; font-weight:600; fill:var(--p); }
.box { fill:var(--surf); stroke:var(--bord); }
.leader { stroke:var(--t); stroke-width:0.5; stroke-dasharray:3 3; }
.c-amber > rect, rect.c-amber, circle.c-amber { fill:var(--am-f); stroke:var(--am-s); } .c-amber > text { fill:var(--am-t); }
.c-coral > rect, rect.c-coral, circle.c-coral { fill:var(--co-f); stroke:var(--co-s); } .c-coral > text { fill:var(--co-t); }
.c-gray > rect, rect.c-gray, circle.c-gray { fill:var(--gr-f); stroke:var(--gr-s); } .c-gray > text { fill:var(--gr-t); }
</style>
