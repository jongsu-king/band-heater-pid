<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밴드 히터 PID 기록</title>
<style>
/* 계측 프로그램의 프런트 패널 방식: 회색 패널, 테두리 묶음, 움푹 들어간 표시창, LED, 검은 차트. 밝기 설정과 무관하게 같은 모양. */
:root { --panel: #d6d6d6; --hi: #f6f6f6; --lo: #6f6f6f; --ink: #000; --ink2: #3c3c3c; --field: #ffffff; --ind: #efefef; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--panel); color: var(--ink); font: 12px/1.35 Tahoma, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
#app { min-height: 100%; display: flex; flex-direction: column; padding: 6px 8px 0; }
#topbar { display: flex; gap: 6px; align-items: stretch; margin-bottom: 6px; }
#topbar .ind { height: 26px; line-height: 20px; }
.state { min-width: 92px; text-align: center; font-weight: 700; line-height: 22px; border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); background: #bdbdbd; letter-spacing: 1px; }
.state.RUN { background: #22b322; color: #fff; } .state.TUNE { background: #f2c200; } .state.FAULT, .state.pc { background: #d01818; color: #fff; }
.state.pc { letter-spacing: 0; padding: 0 8px; white-space: nowrap; }
@keyframes blink { 50% { opacity: 0.3; } }
.blink { animation: blink 1s steps(1) infinite; }
#panel { flex: 1; display: grid; grid-template-columns: 252px minmax(0, 1fr) 176px; gap: 8px; min-height: 0; }
#left, #right { display: flex; flex-direction: column; min-width: 0; }
#mid { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
fieldset { border: 2px groove var(--hi); margin: 0 0 6px; padding: 4px 8px 8px; min-width: 0; }
legend { padding: 0 4px; font-weight: 700; }
.row { display: flex; align-items: center; gap: 6px; margin-top: 5px; min-width: 0; }
.row > label, .lab { flex: none; color: var(--ink); }
.grow { flex: 1; min-width: 0; }
.unit { flex: none; width: 18px; }
.sep { width: 1px; align-self: stretch; background: var(--lo); margin: 0 3px; box-shadow: 1px 0 var(--hi); flex: none; }
/* 표시창(읽기 전용)과 입력창 */
.ind, input:not([type=checkbox]), select, .list, .tbl { border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
.ind { background: var(--ind); padding: 1px 6px; height: 22px; line-height: 16px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ind.str { text-align: left; }
.ind.big { height: 40px; line-height: 34px; font-size: 26px; font-weight: 700; }
input:not([type=checkbox]), select { background: var(--field); color: var(--ink); font: inherit; padding: 1px 5px; height: 22px; min-width: 0; }
input[type=number] { text-align: right; }
input[type=checkbox] { margin: 0 4px 0 0; vertical-align: -2px; }
input:disabled, select:disabled { background: #e2e2e2; color: #777; }
button { font: inherit; color: var(--ink); background: #dedede; border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); padding: 2px 10px; min-height: 24px; cursor: pointer; white-space: nowrap; }
button:active:not(:disabled), button.on { border-color: var(--lo) var(--hi) var(--hi) var(--lo); background: #c4c4c4; }
button:disabled { color: #8a8a8a; cursor: default; }
button.stop { background: #c41e1e; color: #fff; font-weight: 700; letter-spacing: 1px; }
button.stop:disabled { background: #b98a8a; color: #eee; }
button.go { font-weight: 700; }
/* LED */
.leds { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; margin-top: 6px; }
.ledrow { display: flex; align-items: center; gap: 6px; }
.led { width: 15px; height: 15px; border-radius: 50%; border: 1px solid #222; flex: none; background: radial-gradient(circle at 35% 30%, #6d8a6d, #123312 70%); }
.led.on { background: radial-gradient(circle at 35% 30%, #eaffe0, #2dea2d 45%, #0b8f0b); }
.led.red { background: radial-gradient(circle at 35% 30%, #8a6d6d, #3a1010 70%); }
.led.red.on { background: radial-gradient(circle at 35% 30%, #ffe0e0, #ff2a2a 45%, #a00a0a); animation: blink 1s steps(1) infinite; }
.led.yel { background: radial-gradient(circle at 35% 30%, #8a866d, #3a3410 70%); }
.led.yel.on { background: radial-gradient(circle at 35% 30%, #fffbe0, #ffd91a 45%, #a08200); }
/* 출력 막대 */
.slide { height: 16px; background: #fff; border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); position: relative; }
.slide i { position: absolute; left: 0; top: 0; bottom: 0; background: #1f5fbf; }
/* 차트 */
#chartbox { flex: 1; display: flex; flex-direction: column; min-height: 330px; }
#cvwrap { flex: 1; position: relative; min-height: 240px; margin-top: 4px; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
#legend { display: flex; flex-wrap: wrap; gap: 0; background: var(--field); border: 2px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); padding: 1px 2px; }
#legend button { border: 0; background: none; min-height: 18px; padding: 0 5px; display: inline-flex; align-items: center; gap: 4px; }
#legend button.off { color: #9a9a9a; }
#legend .chip { width: 22px; height: 11px; background: #000; display: inline-flex; align-items: center; justify-content: center; }
#legend .chip i { width: 16px; height: 2px; }
#legend button.off .chip i { visibility: hidden; }
#ymin, #ymax { width: 58px; }
/* 탭 */
#tabs { display: flex; gap: 2px; padding-left: 4px; margin-top: 2px; }
#tabs button { border-bottom: 0; min-height: 22px; padding: 1px 11px; background: #c6c6c6; border-color: var(--hi) var(--lo) var(--lo) var(--hi); position: relative; top: 2px; }
#tabs button.on { background: var(--panel); font-weight: 700; border-color: var(--hi) var(--lo) var(--panel) var(--hi); z-index: 1; }
#pages { border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); height: 216px; padding: 8px; overflow: auto; margin-bottom: 6px; }
#pages > div[hidden] { display: none; }
.tbl { border-collapse: collapse; background: var(--field); width: 100%; }
.tbl th, .tbl td { border: 1px solid #a8a8a8; padding: 2px 8px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl th { background: #cfcfcf; font-weight: 400; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl.kv td:first-child { background: #e4e4e4; width: 46%; }
.tbl .chip { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border: 1px solid #000; vertical-align: -1px; }
.tbl.edit td { padding: 1px 2px; } .tbl.edit input { width: 100%; border-width: 1px; height: 20px; } .tbl.edit button { min-height: 20px; padding: 0 8px; }
.list { background: var(--field); height: 100%; overflow: auto; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; gap: 10px; padding: 1px 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.list li:nth-child(odd) { background: #f1f1f1; }
.list time { min-width: 58px; } .list .kind { min-width: 44px; color: var(--ink2); }
.form { display: grid; grid-template-columns: 70px minmax(0, 1fr) 70px minmax(0, 1fr); gap: 5px 8px; align-items: center; }
.form .wide { grid-column: 2 / -1; }
.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; height: 100%; }
.two > div { min-width: 0; }
.num5 { width: 64px; }
/* 온도계 */
#right fieldset { flex: 1; display: flex; flex-direction: column; }
#thwrap { flex: 1; position: relative; min-height: 220px; max-height: 470px; }
#th { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tnum { display: grid; grid-template-columns: auto minmax(0, 1fr) 18px; gap: 4px 5px; align-items: center; margin-top: 4px; }
.tnum .chip { width: 10px; height: 10px; border: 1px solid #000; display: inline-block; margin-right: 4px; vertical-align: -1px; }
.tnum small { grid-column: 1 / -1; color: var(--ink2); margin-top: -3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 0; }
/* 상태 줄 */
#statusbar { display: flex; gap: 4px; padding: 3px 0 5px; }
#statusbar div { border: 1px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); padding: 1px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
#file { flex: 1; min-width: 0; }
.bad { color: #b00000; } .warn { color: #7a5200; }
dialog { border: 2px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); background: var(--panel); color: var(--ink); padding: 14px 16px; max-width: 440px; font: inherit; }
dialog::backdrop { background: rgba(0, 0, 0, 0.3); }
dialog p { margin: 0 0 14px; white-space: pre-line; }
@media (max-width: 900px) { #panel { grid-template-columns: 1fr; } #thwrap { height: 240px; flex: none; } .two { grid-template-columns: 1fr; height: auto; } }
</style>
<div id="app">
  <div id="topbar">
    <div id="t_name" class="ind str grow"></div>
    <div id="t_prog" class="ind str" style="min-width:210px" hidden></div>
    <div id="t_alarm" class="state pc blink" hidden></div>
    <div id="t_state" class="state">–</div>
    <div id="t_el" class="ind" title="기록 경과 시간" style="min-width:78px">–</div>
    <div id="t_wall" class="ind" title="컴퓨터 시각" style="min-width:78px">–</div>
  </div>
  <div id="panel">
    <div id="left">
      <fieldset>
        <legend>연결</legend>
        <div class="row"><select id="port" class="grow" aria-label="시리얼 포트"></select></div>
        <div class="row"><div id="status" class="ind str grow">확인 중</div></div>
        <div class="leds">
          <div class="ledrow"><span id="led_conn" class="led"></span>연결</div>
          <div class="ledrow"><span id="led_sim" class="led yel"></span>가상 보드</div>
        </div>
        <div class="row"><button id="bsim" class="grow" hidden>연습 모드</button><button id="bopen" class="grow">기록 폴더</button></div>
      </fieldset>

      <fieldset>
        <legend>현재값</legend>
        <div class="row"><span class="lab" style="width:34px">PV</span><div id="n_pv" class="ind big grow">–</div><span class="unit">°C</span></div>
        <div class="row"><span class="lab" style="width:34px">SP</span><div id="n_sp" class="ind grow">–</div><span class="unit">°C</span></div>
        <div class="row"><span class="lab" style="width:34px">편차</span><div id="n_dev" class="ind grow">–</div><span class="unit">°C</span></div>
        <div class="row"><span class="lab" style="width:34px">속도</span><div id="n_rate" class="ind grow" title="최근 60초의 PV 기울기">–</div><span class="unit" style="width:30px">°C/분</span></div>
        <div class="row"><span class="lab" style="width:34px">출력</span><div id="n_out" class="ind" style="width:62px">–</div><span class="unit">%</span><div class="slide grow"><i id="bar_out" style="width:0"></i></div></div>
      </fieldset>

      <fieldset>
        <legend>제어</legend>
        <div class="row"><label for="sp" style="width:34px">목표</label><input id="sp" type="number" min="0" max="300" step="1" inputmode="decimal" class="grow"><span class="unit">°C</span><button id="bsp">적용</button></div>
        <div class="row"><button id="brun" class="go grow">운전</button><button id="bstop" class="stop grow">STOP</button></div>
        <div class="row"><div id="n_mode" class="ind str grow">–</div><button id="bclr">알람 해제</button></div>
        <div class="leds">
          <div class="ledrow"><span id="led_run" class="led"></span>운전</div>
          <div class="ledrow"><span id="led_relay" class="led"></span>릴레이</div>
          <div class="ledrow"><span id="led_tune" class="led yel"></span>오토튜닝</div>
          <div class="ledrow"><span id="led_ssr" class="led"></span>SSR</div>
          <div class="ledrow"><span id="led_fault" class="led red"></span>보드 알람</div>
          <div class="ledrow"><span id="led_pc" class="led red"></span>PC 경보</div>
        </div>
      </fieldset>

      <fieldset>
        <legend>명령</legend>
        <div class="row"><input id="cmd" class="grow" placeholder="kp 3 / src 4 / tune" autocomplete="off" spellcheck="false" aria-label="명령"><button id="bcmd">보내기</button></div>
        <div class="row"><div id="msg" class="ind str grow"></div></div>
      </fieldset>
    </div>

    <div id="mid">
      <fieldset id="chartbox">
        <legend>온도 · 출력</legend>
        <div class="row" style="margin-top:0">
          <button data-win="300">5분</button><button data-win="1800">30분</button><button data-win="7200">2시간</button><button data-win="0">전체</button>
          <span class="sep"></span>
          <button id="bhold" title="기록은 계속하고 화면만 멈춤">화면 정지</button>
          <span class="sep"></span>
          <label><input id="yauto" type="checkbox" checked>Y 자동</label>
          <input id="ymin" type="number" step="any" aria-label="Y 최소" disabled><span>~</span><input id="ymax" type="number" step="any" aria-label="Y 최대" disabled>
          <span id="selnote"></span>
          <span class="grow"></span>
        </div>
        <div class="row"><div id="legend" class="grow"></div></div>
        <div id="cvwrap"><canvas id="cv"></canvas></div>
        <div class="row">
          <label for="mark">표시</label>
          <input id="mark" maxlength="120" autocomplete="off" style="width:170px">
          <button id="bmark">남기기</button>
          <span class="sep"></span>
          <span id="curnote">커서 A, B: 차트 클릭</span>
          <button id="bcur">커서 지움</button>
          <span class="grow"></span>
          <button id="bpng">그림 저장</button>
        </div>
      </fieldset>

      <div id="tabs">
        <button data-tab="p_stat" class="on">통계</button><button data-tab="p_resp">응답</button><button data-tab="p_cur">커서</button><button data-tab="p_prog">프로그램</button><button data-tab="p_alarm">경보</button><button data-tab="p_exp">실험</button><button data-tab="p_ev">기록</button><button data-tab="p_set">설정</button>
      </div>
      <div id="pages">
        <div id="p_stat">
          <div class="row" style="margin:0 0 5px"><span id="statcap" class="grow"></span><button id="bstats">통계 저장</button><button id="bpart">구간 CSV 저장</button></div>
          <table id="stats" class="tbl"></table>
        </div>
        <div id="p_resp" hidden><table id="resp" class="tbl kv"></table></div>
        <div id="p_cur" hidden><table id="curs" class="tbl"></table><div id="curd" class="row"></div></div>
        <div id="p_prog" hidden>
          <div class="two">
            <div>
              <table id="steps" class="tbl edit"></table>
              <div class="row"><button id="bstep">단계 추가</button><span class="grow"></span>
                <label for="p_tol">도달 판정 ±</label><input id="p_tol" type="number" min="0.1" max="20" step="0.1" class="num5"><span>°C</span></div>
              <div class="row"><label><input id="p_end" type="checkbox">끝나면 히터 정지</label><span class="grow"></span><button id="bpsave">저장</button></div>
            </div>
            <div>
              <table id="pstat" class="tbl kv"></table>
              <div class="row"><button id="bpgo" class="go grow">프로그램 시작</button><button id="bpstop" class="stop grow">중지</button></div>
            </div>
          </div>
        </div>
        <div id="p_alarm" hidden>
          <div class="two">
            <div>
              <table class="tbl edit">
                <tr><th>항목</th><th>한계 (°C), 비우면 끔</th></tr>
                <tr><td>T1 상한</td><td><input id="a_h0" type="number" step="any"></td></tr>
                <tr><td>T2 상한</td><td><input id="a_h1" type="number" step="any"></td></tr>
                <tr><td>T3 상한</td><td><input id="a_h2" type="number" step="any"></td></tr>
                <tr><td>T4 상한</td><td><input id="a_h3" type="number" step="any"></td></tr>
                <tr><td>채널 간 최대 차이</td><td><input id="a_sp" type="number" step="any" min="0"></td></tr>
              </table>
              <div class="row"><label><input id="a_stop" type="checkbox">경보 때 히터 정지</label><label><input id="a_beep" type="checkbox">경보음</label><span class="grow"></span><button id="basave">저장</button></div>
            </div>
            <div>
              <table id="astat" class="tbl kv"></table>
              <div class="row"><button id="back" class="grow">경보 확인</button></div>
            </div>
          </div>
        </div>
        <div id="p_exp" hidden>
          <div class="form">
            <label for="m_name">실험 이름</label><input id="m_name" maxlength="60">
            <label for="m_sample">시료</label><input id="m_sample" maxlength="100">
            <label for="m_memo">메모</label><input id="m_memo" maxlength="500" class="wide">
            <label for="m_l0">T1 위치</label><input id="m_l0" maxlength="24">
            <label for="m_l1">T2 위치</label><input id="m_l1" maxlength="24">
            <label for="m_l2">T3 위치</label><input id="m_l2" maxlength="24">
            <label for="m_l3">T4 위치</label><input id="m_l3" maxlength="24">
          </div>
          <div class="row" style="margin-top:10px"><button id="bmeta">저장</button><button id="bnew">새 파일로 기록 시작</button></div>
        </div>
        <div id="p_ev" hidden style="height:100%"><ul id="ev" class="list"></ul></div>
        <div id="p_set" hidden>
          <div class="two">
            <div>
              <table class="tbl edit">
                <tr><th>항목</th><th>보드 값</th><th>새 값</th></tr>
                <tr><td>Kp</td><td id="s_kp">–</td><td><input id="e_kp" type="number" step="any" min="0"></td></tr>
                <tr><td>Ki</td><td id="s_ki">–</td><td><input id="e_ki" type="number" step="any" min="0"></td></tr>
                <tr><td>Kd</td><td id="s_kd">–</td><td><input id="e_kd" type="number" step="any" min="0"></td></tr>
                <tr><td>출력 한계 (%)</td><td id="s_out">–</td><td><input id="e_out" type="number" step="1" min="10" max="100"></td></tr>
                <tr><td>제어 기준</td><td id="s_src">–</td><td><select id="e_src" style="width:100%;border-width:1px;height:20px"><option value=""></option><option value="1">TC1</option><option value="2">TC2</option><option value="3">TC3</option><option value="4">TC4</option><option value="avg">AVG</option><option value="max">MAX</option></select></td></tr>
              </table>
              <div class="row"><button id="bpid">새 값 적용</button><span class="grow"></span><button id="btune">오토튜닝</button></div>
            </div>
            <div><table id="info" class="tbl kv"></table></div>
          </div>
        </div>
      </div>
    </div>

    <div id="right">
      <fieldset>
        <legend>열전대</legend>
        <div id="thwrap"><canvas id="th"></canvas></div>
        <div class="tnum" id="tnum"></div>
        <div class="row">* 제어 기준 &nbsp; ◀ 목표</div>
      </fieldset>
    </div>
  </div>
  <div id="statusbar">
    <div id="file"></div><div id="clock">–</div><div id="fw">–</div>
  </div>
</div>
<dialog id="dlg">
  <p id="dlgtext"></p>
  <div class="row"><span class="grow"></span><button id="dlgyes" style="min-width:70px">확인</button><button id="dlgno" style="min-width:70px">취소</button></div>
</dialog>
<script>
const TOKEN = '__TOKEN__';
const SER = [['PV', 'pv'], ['SP', 'sp'], ['T1', 't1'], ['T2', 't2'], ['T3', 't3'], ['T4', 't4'], ['OUT', 'out']];
const IDX = { PV: 1, SP: 2, OUT: 3, T1: 4, T2: 5, T3: 6, T4: 7 }, MODE = 8, BAND = 1.0, HOLD = 60, PANEL = '#d6d6d6';
const KIND = { board: '보드', cmd: '명령', mark: '표시', set: '설정', mode: '상태', conn: '연결', prog: '프로그램', alarm: '경보' };
const PHASE = { start: '시작', ramp: '목표 이동', wait: '도달 대기', hold: '유지' };
// 화면용(검은 바탕)과 그림 저장용(흰 바탕) 색

  return new Promise(res => {
    const d = $('dlg'); $('dlgtext').textContent = text;
    const done = v => { $('dlgyes').onclick = $('dlgno').onclick = d.oncancel = null; d.close(); res(v); };
    $('dlgyes').onclick = () => done(true); $('dlgno').onclick = () => done(false);
    d.oncancel = e => { e.preventDefault(); done(false); };

}

$('basave').onclick = async () => { cfgShown = ''; say(await post('/api/cfg', { hi: [0, 1, 2, 3].map(i => val('a_h' + i)), spread: val('a_sp'), auto_stop: $('a_stop').checked })); };
$('back').onclick = async () => say(await post('/api/ack'));
$('a_beep').onchange = () => { if ($('a_beep').checked && !actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } } };
// 설정
$('bpid').onclick = async () => {
  const cmds = [];
  for (const [id, c, lo, hi] of [['e_kp', 'kp', 0, 1e4], ['e_ki', 'ki', 0, 1e4], ['e_kd', 'kd', 0, 1e5], ['e_out', 'out', 10, 100]]) {
    const v = val(id); if (v == null) continue;
    if (!(v >= lo && v <= hi)) return say({ ok: false, msg: c + ' 값이 범위를 벗어남' });
    cmds.push(c + ' ' + v);
  }
  if ($('e_src').value) cmds.push('src ' + $('e_src').value);
  if (!cmds.length) return say({ ok: false, msg: '새 값이 없습니다' });
  if (!(await ask('보드 설정을 바꿉니다.\n\n' + cmds.join('\n')))) return;
  for (const c of cmds) if (!(await send(c))) return;
  for (const id of ['e_kp', 'e_ki', 'e_kd', 'e_out', 'e_src']) $(id).value = '';
};
$('btune').onclick = async () => { if (await ask('오토튜닝을 시작합니다. 히터가 켜지고 목표 ' + fx(state.sp, 1) + ' °C 근처에서 온도를 여러 번 오르내립니다. 끝나면 게인이 보드에 저장됩니다.')) send('tune'); };

const cv = $('cv');
cv.addEventListener('pointerdown', e => { if (e.button === 0) { drag = { x0: e.offsetX, x1: e.offsetX }; cv.setPointerCapture(e.pointerId); } });
cv.addEventListener('pointermove', e => { hover = e.offsetX; if (drag) drag.x1 = e.offsetX; draw(); });
cv.addEventListener('pointerup', () => {
  if (drag && G) {
    const a = Math.min(drag.x0, drag.x1), b = Math.max(drag.x0, drag.x1), f = x => G.t0 + (Math.min(G.W - G.R, Math.max(G.L, x)) - G.L) / G.PW * (G.t1 - G.t0);
    if (b - a > 6) { if (f(b) - f(a) >= 2) { sel = [f(a), f(b)]; win = -1; } }
    else if (rows.length && a >= G.L && a <= G.W - G.R) {         // 끌지 않고 누르면 커서: A, B, 다시 A 순서
      const t = f(a);
      if (curs[0] == null) curs[0] = t; else if (curs[1] == null) curs[1] = t; else curs = [t, null];
    }
  }
  drag = null; render();
});
cv.addEventListener('pointerleave', () => { hover = null; if (!drag) draw(); });
const ro = new ResizeObserver(() => { draw(); thermo(); }); ro.observe($('cvwrap')); ro.observe($('thwrap'));
poll();
</script>
</html>
